# Project configuration for dbus-virtual-battery.
# Exists primarily to configure ruff: a vendored package at
# `dbus_mqtt_battery.local/` is shared from a sibling project whose naming
# (with the literal `.local` segment) trips ruff's N999 module-naming check
# and produces a false positive in CI. Excluding it keeps the linter green
# without renaming shared code.

[tool.ruff]
extend-exclude = [
    "dbus_mqtt_battery.local",
]
