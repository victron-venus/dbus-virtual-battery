# Project configuration for dbus-virtual-battery.
# Shared D-Bus utils provided by sibling project dbus-mqtt-battery.
# No local vendored package: use dbus_shared or the installed MQTT battery helper.

[project]
name = "dbus-virtual-battery"
version = "2.7.12"
requires-python = ">=3.12,<3.13"

[project.optional-dependencies]
dev = []
test = ["pytest>=9.1.1", "pytest-cov>=7.1.0", "PyYAML==6.0.3", "ruff>=0.17.0"]

[tool.ruff]
target-version = "py312"
extend-exclude = []

[tool.coverage.run]
# Include the real CLI work exercised in subprocess-based release contracts.
patch = ["subprocess"]
source = ["."]
# Measure application and shipped maintenance tooling, never the test code itself.
omit = [
    "tests/*",
    ".github/workflow-tests/*",
    ".github/release-tests/*",
    ".venv/*",
    ".venv-ci/*",
]

[tool.coverage.report]
# Unimported scripts outside packages must contribute uncovered statements.
include_namespace_packages = true
omit = ["tests/*", ".github/workflow-tests/*", ".github/release-tests/*", ".venv/*", ".venv-ci/*"]

[tool.pytest.ini_options]
filterwarnings = ["error"]
