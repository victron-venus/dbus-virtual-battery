# Project configuration for dbus-virtual-battery.
# Shared D-Bus utils provided by sibling project dbus-mqtt-battery.
# No local vendored package: use dbus_shared or the installed MQTT battery helper.

[project]
name = "dbus-virtual-battery"
version = "2.7.7"
requires-python = ">=3.12,<3.13"

[project.optional-dependencies]
dev = []
test = ["pytest>=9.1.1", "pytest-cov>=7.1.0"]

[tool.ruff]
target-version = "py312"
extend-exclude = []

[tool.coverage.run]
# Shared release tooling has its own mandatory contract suite. Keep application
# and native packaging coverage, including scripts/package_release.py, here.
omit = [
    "tests/*",
    "scripts/release.py",
    "scripts/release_control.py",
    "scripts/prepare_version.py",
    "scripts/release_container_labels.py",
    "scripts/release_state.py",
    "scripts/release_version_adapter.py",
    "scripts/release_versioned.py",
    "scripts/stage_release_assets.py",
    "scripts/version_plan.py",
    "scripts/version_receipt.py",
    "scripts/write_binary_build_metadata.py",
    "scripts/write_web_build_metadata.py",
]
