name: 'Auto Approve PRs'
description: 'Auto-approve Dependabot, Renovate, and 4alvit PRs'

"on":
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  auto-approve:
    name: Auto Approve
    uses: victron-venus/venus-os-ci-toolkit/.github/workflows/auto-approve-reusable.yml@e28758052622930319f955cf2601e0b913417423
    with:
      pr-author: 'dependabot[bot],renovate[bot],4alvit'
      required-reviews: '0'
      pr-types: 'all'
