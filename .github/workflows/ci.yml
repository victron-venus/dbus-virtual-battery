name: CI

on:
  workflow_call:

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: victron-venus/venus-os-ci-toolkit/.github/workflows/python-ci.yml@4b041db3d7ce951732c102e2195c7d0178c401bb # main
    with:
      use-uv-lock: true
      dependency-extras: "test"
      python-version: '3.12.13'
      run-type-check: false  # Disable type checking as the original didn't have it
      coverage-threshold: 80
      test-args: tests/ .github/workflow-tests/ .github/release-tests/
