name: CI

on:
  workflow_call:

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: victron-venus/venus-os-ci-toolkit/.github/workflows/python-ci.yml@5f5ff3846aacee0edfbeadeb316ee68525e9208d # main
    with:
      python-version: '3.12.13'
      run-type-check: false  # Disable type checking as the original didn't have it
      coverage-threshold: 80
      test-args: tests/
