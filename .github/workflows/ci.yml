name: CI

on:
  workflow_call:

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: victron-venus/venus-os-ci-toolkit/.github/workflows/python-ci.yml@21a366f200f0371a10a6de7ad6ca263af230b842 # main
    with:
      use-uv-lock: true
      dependency-extras: "test"
      python-version: '3.12.13'
      run-type-check: false  # Disable type checking as the original didn't have it
      coverage-threshold: 80
      test-args: tests/ .github/workflow-tests/ .github/release-tests/
