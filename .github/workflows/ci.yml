name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: ['**']

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: victron-venus/venus-os-ci-toolkit/.github/workflows/python-ci.yml@a8c0e51b1de43cac8c90d966326684553ca166ff
    with:
      python-version: '3.11'
      install-dependencies: false
      run-type-check: false
