name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: victron-venus/venus-os-ci-toolkit/.github/workflows/python-ci.yml@6da015c8cece60541100e55c14829f2c34a01d6e
    with:
      python-version: '3.11'
      run-type-check: false  # Disable type checking as the original didn't have it