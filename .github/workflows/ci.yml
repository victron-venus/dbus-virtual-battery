name: CI

on:
  workflow_call:

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: victron-venus/venus-os-ci-toolkit/.github/workflows/python-ci.yml@f96a5ff0e1e4ff7cf2c8bf0f44fbd30e9bc74266 # main
    with:
      python-version: '3.12.13'
      run-type-check: false  # Disable type checking as the original didn't have it
      coverage-threshold: 80
      test-args: tests/
