name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: victron-venus/venus-os-ci-toolkit/.github/workflows/python-ci.yml@5b18667880c7a0154b7c7e6686042eff5f47cdb7
    with:
      python-version: '3.11'
      run-type-check: false  # Disable type checking as the original didn't have it
      # Service code imports dbus/vedbus (Venus OS runtime only) — untestable in CI
      # without stubbing the whole D-Bus stack. Raise once real tests with mocks exist.
      coverage-threshold: 0