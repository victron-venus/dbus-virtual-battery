name: CI

on:
  workflow_call:

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: victron-venus/venus-os-ci-toolkit/.github/workflows/python-ci.yml@b8154dfcf2d4cf829cb41514ef3cbf82c68a418f # main
    with:
      use-uv-lock: true
      dependency-extras: "test"
      python-version: '3.12.13'
      run-type-check: false  # Disable type checking as the original didn't have it
      coverage-threshold: 80
      test-args: tests/ .github/workflow-tests/
